---
name: release

# Publish the spiderw CLI on a version tag. GoReleaser cross-compiles the CLI
# (see .goreleaser.yaml) and attaches the archives and checksums to a GitHub
# Release. Nothing here builds on a branch push, so a tag is the only trigger.

# yamllint disable-line rule:truthy
on:
  push:
    tags: ["v*"]

# Least privilege: default every job to read-only, and grant write only to the
# job that needs it (below), so a job added later inherits read-only, not write.
permissions:
  contents: read

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload assets

    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # GoReleaser needs full history and tags for the changelog.
          fetch-depth: 0
      # yamllint disable-line rule:line-length
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # yamllint disable-line rule:line-length
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
